[project]
name = "tradingasakan"
version = "0.0.1"
description = "AI trading research system (BUILDPLAN v4.2); Phase 1 Foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "."]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend/src"
files = ["backend/src/trading/config.py", "backend/src/trading/contracts"]
