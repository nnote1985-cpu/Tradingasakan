name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - name: Install (locked)
        run: uv sync --locked --python 3.13
      - name: Lint
        run: uv run ruff check .
      - name: Types (Foundation modules)
        run: uv run mypy
      - name: Tests (unit + migrations on local PostgreSQL)
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: uv run pytest -q
